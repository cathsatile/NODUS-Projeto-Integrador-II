name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test-frontend:
    name: Frontend — testes e cobertura
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: nodus-app

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: nodus-app/package-lock.json

      - name: Instalar dependências
        run: npm ci

      - name: Executar testes com cobertura
        run: npx ng test --no-watch --coverage

      - name: Upload relatório de cobertura
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-frontend
          path: nodus-app/coverage/
          retention-days: 7

  test-backend:
    name: Backend — tipos, testes e cobertura
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: nodus-app/backend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: nodus-app/backend/package-lock.json

      - name: Instalar dependências
        run: npm ci

      - name: Verificar tipos TypeScript
        run: npm run typecheck

      - name: Executar testes com cobertura
        run: npm run test:coverage

      - name: Upload relatório de cobertura
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-backend
          path: nodus-app/backend/coverage/
          retention-days: 7

  build-desktop:
    name: Desktop — empacotamento Electron
    needs: [test-frontend, typecheck-backend]
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            nodus-app/package-lock.json
            nodus-app/backend/package-lock.json

      - name: Instalar dependências (frontend + Electron)
        working-directory: nodus-app
        run: npm ci

      - name: Instalar dependências (backend)
        working-directory: nodus-app/backend
        run: npm ci

      - name: Build Angular
        working-directory: nodus-app
        run: npx ng build --configuration production

      - name: Compilar backend
        working-directory: nodus-app/backend
        run: npx tsc --noEmit false

      - name: Compilar processo main Electron
        working-directory: nodus-app
        run: npx tsc --project tsconfig.electron.json

      - name: Empacotar com electron-builder
        working-directory: nodus-app
        run: npx electron-builder --win portable --publish never

      - name: Upload artefato
        uses: actions/upload-artifact@v4
        with:
          name: nodus-desktop-win
          path: nodus-app/dist-pkg/*.exe
          retention-days: 14
